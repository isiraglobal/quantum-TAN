<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Amanita muscaria inspired - iconic but stylized -->
  <g transform="translate(100, 180)">
    <!-- Cap -->
    <path d="M-45 -60 Q-45 -90 0 -90 Q45 -90 45 -60" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <path d="M-30 -75 Q-15 -85 0 -80 Q15 -85 30 -75" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <path d="M-20 -70 Q-10 -80 0 -75 Q10 -80 20 -70" stroke="currentColor" stroke-width="1" opacity="0.3"/>

    <!-- Warts on cap -->
    <g fill="currentColor" opacity="0">
      <circle cx="-25" cy="-78" r="3" fill="white" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="0" cy="-82" r="4" fill="white" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="22" cy="-76" r="3" fill="white" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="-10" cy="-72" r="2.5" fill="white" stroke="currentColor" stroke-width="1"/>
      <circle cx="12" cy="-70" r="2" fill="white" stroke="currentColor" stroke-width="1"/>
    </g>

    <!-- Gills -->
    <g stroke-width="1" opacity="0.6">
      <path d="M-25 -60 L-10 -30"/>
      <path d="M-15 -60 L-5 -30"/>
      <path d="M-5 -60 L0 -30"/>
      <path d="M5 -60 L10 -30"/>
      <path d="M15 -60 L20 -30"/>
      <path d="M25 -60 L30 -30"/>
    </g>

    <!-- Stem -->
    <path d="M-12 -30 L-10 20" stroke-width="2.5"/>
    <path d="M12 -30 L10 20" stroke-width="2.5"/>

    <!-- Ring -->
    <path d="M-15 -10 Q-15 -15 -5 -15 Q5 -15 15 -10" fill="none" stroke-width="2"/>
    <path d="M-12 -12 L-12 0" stroke-width="1" opacity="0.4"/>
    <path d="M12 -12 L12 0" stroke-width="1" opacity="0.4"/>

    <!-- Volva at base -->
    <path d="M-18 20 Q-18 30 0 30 Q18 30 18 20" fill="none" stroke-width="2"/>
    <path d="M-15 22 L-15 30" stroke-width="1" opacity="0.4"/>
    <path d="M15 22 L15 30" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Mycelium threads at base -->
  <g transform="translate(100, 190)" stroke-width="1" opacity="0.4">
    <path d="M-10 30 L-30 50 L-20 70"/>
    <path d="M0 30 L-10 55 L5 75"/>
    <path d="M10 30 L30 50 L20 70"/>
    <path d="M-5 30 L-25 60"/>
    <path d="M5 30 L25 60"/>
  </g>
</svg>