<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Mycelium network background pattern -->
  <defs>
    <pattern id="mycelium-pattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M100 0 C100 0 40 60 40 120 C40 180 100 200 100 200 C100 200 160 180 160 120 C160 60 100 0 100 0 Z" opacity="0.15"/>
      <path d="M100 60 L100 180" opacity="0.2"/>
      <path d="M40 120 L160 120" opacity="0.2"/>
      <circle cx="100" cy="120" r="25" opacity="0.15"/>
      <circle cx="100" cy="120" r="12" opacity="0.25"/>
      <circle cx="70" cy="90" r="6" opacity="0.2"/>
      <circle cx="130" cy="150" r="5" opacity="0.2"/>
      <circle cx="85" cy="155" r="4" opacity="0.15"/>
      <circle cx="115" cy="85" r="5" opacity="0.15"/>
      <path d="M70 90 L55 70" opacity="0.15"/>
      <path d="M130 150 L145 170" opacity="0.15"/>
      <path d="M85 155 L70 180" opacity="0.1"/>
      <path d="M115 85 L130 60" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="400" height="500" fill="url(#mycelium-pattern)"/>

  <!-- Central mycelium motif -->
  <g transform="translate(200, 250)">
    <circle r="80" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <circle r="55" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"/>
    <circle r="30" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
    <circle r="12" fill="currentColor" opacity="0.5"/>

    <!-- Radiating hyphae -->
    <g stroke-width="1.2" opacity="0.4">
      <path d="M0 -12 L0 -80"/>
      <path d="M0 12 L0 80"/>
      <path d="M-12 0 L-80 0"/>
      <path d="M12 0 L80 0"/>
      <path d="M-8.5 -8.5 L-56 -56"/>
      <path d="M8.5 8.5 L56 56"/>
      <path d="M-8.5 8.5 L-56 56"/>
      <path d="M8.5 -8.5 L56 -56"/>
    </g>

    <!-- Branching nodes -->
    <g fill="currentColor" opacity="0.4">
      <circle cx="0" cy="-55" r="4"/>
      <circle cx="0" cy="55" r="4"/>
      <circle cx="-55" cy="0" r="4"/>
      <circle cx="55" cy="0" r="4"/>
      <circle cx="-39" cy="-39" r="3"/>
      <circle cx="39" cy="39" r="3"/>
      <circle cx="-39" cy="39" r="3"/>
      <circle cx="39" cy="-39" r="3"/>
    </g>

    <!-- Secondary branching -->
    <g stroke-width="0.8" opacity="0.3">
      <path d="M0 -55 L-25 -70"/>
      <path d="M0 -55 L25 -70"/>
      <path d="M0 55 L-25 70"/>
      <path d="M0 55 L25 70"/>
      <path d="M-55 0 L-70 -25"/>
      <path d="M-55 0 L-70 25"/>
      <path d="M55 0 L70 -25"/>
      <path d="M55 0 L70 25"/>
    </g>
  </g>

  <!-- Spore particles floating -->
  <g fill="currentColor" opacity="0.3">
    <circle cx="60" cy="80" r="2"/>
    <circle cx="340" cy="120" r="1.5"/>
    <circle cx="80" cy="420" r="2"/>
    <circle cx="320" cy="380" r="1.5"/>
    <circle cx="150" cy="60" r="1"/>
    <circle cx="250" cy="440" r="1.5"/>
    <circle cx="350" cy="300" r="1"/>
    <circle cx="50" cy="300" r="1.5"/>
  </g>
</svg>