<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Boletus edulis - Porcini / King Bolete -->
  <g transform="translate(100, 180)">
    <!-- Cap - broad, convex -->
    <path d="M-55 -20 Q-55 -55 0 -55 Q55 -55 55 -20" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <path d="M-40 -30 Q-20 -42 0 -45 Q20 -42 40 -30" stroke="currentColor" stroke-width="1" opacity="0.4"/>
    <path d="M-30 -25 Q-15 -35 0 -37 Q15 -35 30 -25" stroke="currentColor" stroke-width="1" opacity="0.3"/>

    <!-- Pore surface (instead of gills) -->
    <g stroke-width="1" opacity="0.5">
      <path d="M-35 -20 L-30 5"/>
      <path d="M-25 -20 L-22 5"/>
      <path d="M-15 -20 L-14 5"/>
      <path d="M-5 -20 L-6 5"/>
      <path d="M5 -20 L4 5"/>
      <path d="M15 -20 L14 5"/>
      <path d="M25 -20 L22 5"/>
      <path d="M35 -20 L30 5"/>
    </g>

    <!-- Stem - thick, reticulated -->
    <path d="M-20 5 L-18 45" stroke-width="2.5"/>
    <path d="M20 5 L18 45" stroke-width="2.5"/>

    <!-- Reticulation on stem -->
    <g stroke-width="0.8" opacity="0.5">
      <path d="M-20 10 L-15 15 L-20 20 L-15 25 L-20 30 L-15 35 L-20 40"/>
      <path d="M20 10 L15 15 L20 20 L15 25 L20 30 L15 35 L20 40"/>
      <path d="M-18 12 L-16 18 L-18 24 L-16 30 L-18 36"/>
      <path d="M18 12 L16 18 L18 24 L16 30 L18 36"/>
    </g>

    <!-- Bulbous base -->
    <path d="M-22 45 Q-22 50 0 50 Q22 50 22 45" stroke-width="2"/>
  </g>

  <!-- Forest floor context -->
  <g transform="translate(100, 200)" stroke-width="1" opacity="0.3">
    <path d="M-40 35 L-45 50 L-35 45"/>
    <path d="M40 35 L45 50 L35 45"/>
    <path d="M-20 35 L-25 50 L-15 45"/>
    <path d="M20 35 L25 50 L15 45"/>
    <circle cx="0" cy="40" r="15" stroke-width="0.5" fill="none"/>
    <path d="M-10 40 L-5 55"/>
    <path d="M10 40 L5 55"/>
  </g>
</svg>